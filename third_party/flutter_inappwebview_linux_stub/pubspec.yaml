name: flutter_inappwebview_linux
description: >-
  Dart-only stand-in for flutter_inappwebview_linux. NAHPU never opens a web
  view on Linux, so this skips the upstream plugin's WPE WebKit native build.
version: 0.1.0-beta.1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        dartPluginClass: LinuxInAppWebViewPlatform
